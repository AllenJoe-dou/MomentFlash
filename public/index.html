<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff7aa7">
  <title>一闪 Moment</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="participant-page">
  <canvas id="liquid-background" aria-hidden="true"></canvas>

  <header class="topbar glass-card">
    <a class="brand" href="/" aria-label="返回一闪 Moment 首页">
      <span class="brand-mark">✦</span>
      <span>
        <strong>一闪 Moment</strong>
        <small>让此刻，被好好收藏</small>
      </span>
    </a>
    <a class="admin-link" href="/admin">操作台</a>
  </header>

  <main class="page-shell">
    <section class="intro">
      <p class="eyebrow">A little moment, a lasting memory</p>
      <h1>一闪 Moment</h1>
      <p id="page-description" class="description">把这一瞬间，留给值得的人。</p>
    </section>

    <section class="image-section glass-card">
      <div class="section-heading">
        <div>
          <span class="section-index">01</span>
          <h2>这一刻，被认真呈现</h2>
          <p>图片由操作人员设置，并在桌面和手机上完整展示。</p>
        </div>
      </div>

      <div id="display-image-frame" class="display-image-frame">
        <img id="display-image" alt="操作人员设置的展示图片">
      </div>
    </section>

    <section class="response-section glass-card">
      <div class="section-heading">
        <div>
          <span class="section-index">02</span>
          <h2>写下这一刻</h2>
          <p>选好选项，或输入只有你们懂的话。</p>
        </div>
      </div>
      <div id="fields-container" class="fields-container"></div>
    </section>

    <section class="submit-section glass-card">
      <div>
        <span class="section-index">03</span>
        <h2>准备好了吗？</h2>
        <p>确认内容后提交，操作人员就能看到你的心意。</p>
      </div>
      <button id="submit-button" class="submit-button" type="button">
        <span>提交这一刻</span>
        <span aria-hidden="true">→</span>
      </button>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/backgrounds.js"></script>
  <script src="/app.js"></script>
</body>
</html>
